<style>
/* Layout: slim top bar with tabs, summary strip first, charts, then breakdown tables. Reviews sit in their own tab. One column on phones. */
:root{

  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d141a; --surface:#141f28; --surface-2:#1b2935; --fg:#e5ecf1; --muted:#8da0b0; --line:#25343f;
    --accent:#3fb7b0; --accent-fg:#06191a; --gain:#4cc58a; --loss:#ff7b70; --warn:#f0c15a; --warn-bg:#2e2410;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d141a; --surface:#141f28; --surface-2:#1b2935; --fg:#e5ecf1; --muted:#8da0b0; --line:#25343f;
  --accent:#3fb7b0; --accent-fg:#06191a; --gain:#4cc58a; --loss:#ff7b70; --warn:#f0c15a; --warn-bg:#2e2410;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1720px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px 16px;border-bottom:1px solid var(--line)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border:1px solid var(--line);border-radius:8px;padding:10px 14px}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}

.scroll{overflow-x:auto}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--font-mono)}

.preview b{font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.err{color:var(--loss);font-size:13px;min-height:1.2em}

.help{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:65ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;z-index:20}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 16px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--fg);margin:0 0 6px;cursor:pointer}
label.chk input{width:auto;flex:none}
.tag.ok{color:var(--gain)} .tag.bad{color:var(--loss)}
.drop{border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--fg);background:var(--surface-2)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.thumbs:empty{display:none}
.thumb{position:relative;aspect-ratio:16/10;min-width:0}
.thumb-open{display:block;width:100%;height:100%;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);cursor:pointer}

.thumb-del{position:absolute;top:4px;right:4px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px;line-height:1;cursor:pointer}

#lightbox[hidden]{display:none}
#lightbox{position:fixed;inset:0;z-index:30;background:rgba(5,10,14,.93);display:flex;flex-direction:column;gap:10px;color:#fff;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

.cal-ctl{display:flex;flex-direction:column;gap:12px}

.cal-num{font-size:12px;font-weight:500;color:var(--muted);line-height:1.5}

.cal-pnl{font-family:var(--font-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.grid2{grid-template-columns:1fr}

.chk-grid{grid-template-columns:1fr}

.dbox{display:flex;flex-direction:column;min-width:0;position:relative}
.dbox.dw-full{grid-column:1/-1}
.dbox.dmin{align-self:start}
.dbox.dlone{grid-column:1/-1;justify-self:center;width:calc((100% - 20px)/2)}
@media (max-width:900px){.dbox.dlone{grid-column:auto;justify-self:stretch;width:auto}}
.odds-cur td{font-weight:600}
/* the odds table fits inside the prop card, so it never needs a scroll bar */
table.odds{width:100%;table-layout:fixed}
table.odds th,table.odds td{padding:6px 4px;font-size:12px;white-space:nowrap}
table.odds th{white-space:normal;letter-spacing:.02em}
table.odds th:first-child,table.odds td:first-child{width:30%;padding-left:0}
table.odds th:last-child,table.odds td:last-child{padding-right:0}
.prop-row{flex-wrap:wrap}
.prop-row>span:last-child{margin-left:auto}
.dbox>.panel{flex:1 1 auto}
.dbox>.strip.oneline{width:auto}
/* the handle and minimize button only appear on the box you clicked, floating on its top edge so nothing shifts */
.dbar{display:none;position:absolute;top:-13px;right:12px;z-index:3;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 4px}
/* the account card switches views when clicked */
#acctCard{cursor:pointer;user-select:none}
.dbar .dname{display:none}
.dbar .btn{padding:2px 8px;min-height:22px;line-height:1}
.dbox.dsel .dbar{display:flex}
/* a minimized box stays on screen as a slim card with its name */
.dbox.dmin .dbar{display:flex;position:static;border-color:var(--line);border-radius:10px;padding:6px 8px;font-size:14px;color:var(--fg);cursor:pointer}
.dbox.dmin .dbar .dname{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbox.dmin:not(.dsel) .dbar .btn{display:none}
.dset-list{display:flex;flex-direction:column;gap:6px}
.dset-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dset-row.off{opacity:.6}
.dset-row .dset-name{flex:1 1 200px;min-width:0}
.dset-row select{width:auto;padding:4px 6px;font-size:13px}
.dset-row label.chk{margin:0}
/* ---------- v23: size hint, undo, folder backup, update history, monthly report ---------- */
.size-hint{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px}
.cchips label.chk:has(input:checked){border-color:var(--accent);color:var(--accent)}
.undo-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.fs-box{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.month-report .insight{margin-bottom:16px}
@media print{#tab-review .rev-head .panel:first-child{display:none!important}}
/* ---------- v29: customization ---------- */
.cust{display:flex;flex-direction:column;gap:20px}
.cust-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px 20px;align-items:start}
.cust-f label{margin-top:0}
.cust-f label.chk{margin:4px 0}
.lists6 textarea{min-height:170px}
.ct-grid{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px 10px;align-items:center;max-width:640px}
.ct-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cols-panel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.cols-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px}
.cols-row,.tab-row{display:flex;align-items:center;gap:8px}
.cols-row label.chk,.tab-row label.chk{margin:0}
.tab-rows{display:flex;flex-direction:column;gap:6px;max-width:520px}
.tab-row input[type=text]{flex:1;min-width:0}
.tab-row.off input[type=text]{opacity:.6}
.brk-rec{display:block;margin-top:6px}
.banner.brk{margin-bottom:20px}
.fee-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px 12px}
.fee-grid>div{min-width:0}
@media (max-width:900px){.fee-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:560px){.fee-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- v24: Setup & data laid out across the full window ---------- */
.data-stack{display:flex;flex-direction:column;gap:20px}
.lists5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.lists5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.lists5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.lists5{grid-template-columns:1fr}}
.tilt-row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;margin-top:16px}
.tilt-row label{margin-top:0}
#backupBox .banner span:first-child{flex:1 1 280px;min-width:0}
/* ---------- v32: one font everywhere (headings, numbers and text boxes follow the text font) ---------- */
:root:root:root{--font-display:var(--font-body);--font-mono:var(--font-body)}
textarea,textarea.prose,textarea.bullets{font-family:var(--font-body);font-size:14px;line-height:1.5}
input,select,button,.btn,table,th,td,dd,dt,.tag,h1,h2,h3,.info-i{font-family:var(--font-body)}
.info-i{font-style:normal;font-weight:600}
td.num,dd,.cal-pnl,.tv-pnl,.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* ---------- v32: tighter spacing so tables fit without a scroll bar ---------- */
.panel{padding:14px}
th,td{padding:6px 7px}
th{white-space:normal}
.dgrid table,.grid2 table,.rev-duo table,.prop-card table{font-size:13px}
.dgrid td:first-child,.grid2 td:first-child,.rev-duo td:first-child,.rev-side td:first-child{white-space:normal;min-width:84px}
.rev-duo td{white-space:normal}
.rev-duo td .btn{white-space:nowrap}
.dgrid{gap:12px 16px}
main{gap:16px}
.tt td.wrap{white-space:normal;min-width:96px;max-width:150px}
.tt td.notes{max-width:180px}
/* ---------- v35: light theme, drawing, chart legend, shortcuts ---------- */

html[data-mode="light"] header.top h1 small{color:var(--muted)}
html[data-mode="light"] .panel{box-shadow:0 6px 20px rgba(20,30,60,.08)}
.draw-bar{flex-wrap:wrap;gap:6px}
.draw-bar .lb-btn.on{background:#fff;color:#111}
.draw-bar .primary-lb{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.draw-bar input[type=text]{width:170px;padding:5px 8px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.draw-bar input[type=color]{width:40px;height:30px}
.draw-bar select{width:auto;padding:4px 6px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.draw-gap{flex:1}
.draw-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px;min-height:0}
#dCanvas{max-width:100%;max-height:calc(100vh - 130px);cursor:crosshair;touch-action:none;border-radius:6px}
.line-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:13px}
.line-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
kbd{font-family:var(--font-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:var(--surface-2)}
.kbd-list td{border:0;padding:5px 10px 5px 0}
.kbd-in{width:132px;text-align:center;font-family:var(--font-mono);padding:4px 6px;cursor:pointer}
#kbdHelp{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
/* the merge preview: one group per part, each item with its own tick */
#dataMsg:not(:empty){margin-top:12px}
/* quick log: big targets for thumbs */
.ql{max-width:560px;margin:0 auto}.ql-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ql-label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.ql-chips{display:flex;flex-wrap:wrap;gap:8px}
.ql-chip{font:inherit;font-weight:600;padding:10px 14px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.ql-chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ql-other{max-width:110px;min-height:44px;text-transform:uppercase}
.ql-side,.ql-step{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ql-step{grid-template-columns:64px 1fr 64px;align-items:center;text-align:center}
.ql-step span{font-family:var(--font-mono);font-size:24px;font-weight:600}
.ql-big{font:inherit;font-size:17px;font-weight:700;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.ql-big.on.long{background:var(--gain);color:#06210f;border-color:var(--gain)}.ql-big.on.short{background:var(--loss);color:#2a0606;border-color:var(--loss)}
.ql-prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ql-num{font-family:var(--font-mono);font-size:18px;min-height:48px;width:100%}
.ql-prev{margin:16px 0 10px;font-size:16px;text-align:center}
.ql-save{width:100%;min-height:54px;font-size:17px;font-weight:700;border-radius:14px}/* check my journal */
.hc{display:flex;flex-direction:column;gap:6px;margin-top:10px}.hc-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}.hc-row>span:first-child{font-weight:700;width:12px}.hc-row>span:nth-child(2){flex:1 1 300px}
.mg-grp{margin:0 0 10px}.mg-list{display:flex;flex-direction:column;gap:2px;margin:4px 0 0 26px;max-height:240px;overflow-y:auto}.mg-list .chk{font-weight:400}.mg-list .tag{font-size:10px}
/* shown while a file is dragged over the window */
#dropHint{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.35)}
#dropHint[hidden]{display:none}
#dropHint div{max-width:440px;text-align:center;font-size:16px;font-weight:600;color:var(--fg);background:var(--surface);border:2px dashed var(--accent);border-radius:16px;padding:28px 32px}
#kbdHelp[hidden]{display:none}
.kbd-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:440px;width:100%;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
/* ---------- v39: more filters on the Trades tab ---------- */
.tf-panel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.tf-group h3{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px}
.tf-f label{font-size:12px;margin:0 0 3px}
.tf-f select{padding:5px 8px;font-size:13px}
.tf-dates{display:flex;gap:6px;margin-top:6px}
.tf-dates input{padding:4px 6px;font-size:12px}
.tf-save{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.tf-save input{flex:1 1 220px;max-width:340px;padding:5px 8px;font-size:13px}
.tf-x{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px}
.tf-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px}
.tf-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--accent);border-radius:99px;padding:2px 4px 2px 10px;background:var(--accent-soft,transparent)}
.tf-chip b{font-weight:600}
.tf-chip button{font:inherit;background:none;border:0;color:var(--fg);cursor:pointer;padding:0 6px;line-height:1}
.tf-clearall{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.tf-cust{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 14px}
/* ---------- v40: account groups ---------- */
.grp-block{border:1px solid var(--line);border-radius:14px;padding:12px 12px 2px;margin:0 0 12px;background:var(--accent-soft)}
.grp-top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 10px}
.grp-top .btn{margin-left:auto}
tr.grp-head td{background:var(--accent-soft);border-top:1px solid var(--line);font-size:13px}
/* ---------- v42: prop firm certificates in the Gallery ---------- */
.cert-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px;margin:0 0 12px}
.cert-form .cert-wide{grid-column:1/-1}
.cert-empty{aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:12px 12px 0 0;margin:0;font-size:13px;color:var(--muted)}

(function(){

  CL:[1000,0.01],MCL:[100,0.01],GC:[100,0.1],MGC:[10,0.1],SI:[5000,0.005],NG:[10000,0.001],ZB:[1000,1/32],ZN:[1000,1/64],'6E':[125000,0.00005]};

var FEE_ORDER=['ES','MES','NQ','MNQ','YM','MYM','RTY','M2K','SI','CL','MCL','GC','MGC','NG','ZB','ZN','6E'];

/* a trailing limit that locks stops at the starting balance plus this amount (most firms use $100) */
function lockLevel(a){return a.start+(isFinite(a.lockAdd)&&a.lockAdd!==null?+a.lockAdd:100)}
function grpById(id){return (state.settings.groups||[]).filter(function(g){return g.id===id})[0]||null}
function multiGrp(){return (state.settings.groups||[]).length>1}
/* a trade with no group, or one whose group was removed, belongs to the first group */
function tradeGrp(t){return t.grp&&grpById(t.grp)?t.grp:state.settings.groups[0].id}
function grpAccts(g){return state.settings.accounts.filter(function(a){return a.grp===g})}
function grpLeader(g){return grpAccts(g)[0]||null}
function isLead(a){return grpLeader(a.grp)===a}
/* the group new trades and imports go to: the one last used */
function curGrp(){var g=state.settings.lastGrp;return grpById(g)?g:state.settings.groups[0].id}
/* keep accounts in group order, so each group's leader comes first in it */

function grpFollow(g){var o=grpById(g);return o&&o.follow&&o.follow!==g&&grpById(o.follow)?o.follow:null}

function acctHas(a,t){return grpGets(a.grp,tradeGrp(t))&&!(a.since&&t.date<a.since)}

/* a leader's size is against the leader it follows; everyone else's is against their own group's leader */

/* the Dashboard's leader tile shows the first group's leader, named when there are several groups */
function leadTile(){return multiGrp()?esc(state.settings.groups[0].name)+' leader':'Leader account'}
function acctRows(){
  var tr=allChrono();

    /* every trade remembers the leader size it was logged at (t.lm), so changing leader never rewrites history */

/* ---------- math ---------- */

/* ---------- commissions and fees: your all-in round-trip cost per contract ---------- */
function feeRoot(sym){sym=String(sym||'').toUpperCase().replace(/^\//,'');for(var i=0;i<ROOTS.length;i++)if(sym.indexOf(ROOTS[i])===0)return ROOTS[i];return '*'}

function feeOf(t){return t.fee!=null&&t.fee!==''&&isFinite(t.fee)?+t.fee:feeRate(t.ticker)*(+t.qty||0)}

}

}
function allChrono(){

function compress(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var max=1800,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);c.toBlob(function(b){b?res(b):rej(new Error('encode'))},'image/jpeg',0.86)};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'))};
  img.src=url})}

function toCSV(){
  var cols=['date','ticker','side','setup','qty','entry','exit','stop','multiplier','plan','mistake','notes','time','exit time','exit date','target','fees','conditions','grade','group'];
  var q=function(x){x=x==null?'':String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  return [cols.join(',')].concat(sortedChrono().map(function(t){return [t.date,t.ticker,t.side,t.setup,t.qty,t.entry,t.exit,t.stop==null?'':t.stop,t.mult,t.plan,mistakesOf(t).join('; ')||'None',t.notes,t.time||'',t.xtime||'',t.xdate||'',t.target>0?t.target:'',+feeOf(t).toFixed(2),condsOf(t).join('; '),t.egrade||'',grpById(tradeGrp(t)).name].map(q).join(',')})).join('\n');
}
function parseCSV(text){
  var rows=[],row=[],f='',inq=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(inq){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else inq=false}else f+=ch}
    else if(ch==='"')inq=true;
    else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=ch}
  row.push(f);if(row.length>1||row[0]!=='')rows.push(row);
  return rows;
}
function importCSV(text){
  var rows=parseCSV(text);if(rows.length<2)return {ok:0,bad:0,err:'Nothing to import. The first row must be the column headers.'};
  var h=rows[0].map(function(x){return x.trim().toLowerCase()});
  var det=detectImport(h);if(det)return importAny(rows,h,det);
  var need=['date','ticker','side','qty','entry','exit'];
  for(var i=0;i<need.length;i++)if(h.indexOf(need[i])<0)return {ok:0,bad:0,err:'Missing column "'+need[i]+'".'};
  var ix=function(r,n){var k=h.indexOf(n);return k<0?'':(r[k]||'').trim()};
  var ok=0,bad=0;
  rows.slice(1).forEach(function(r){
    var tk=ix(r,'ticker').toUpperCase(),qty=parseFloat(ix(r,'qty'));
    /* a group column matches a group by name; otherwise the trade goes to the import group */
    var gn=ix(r,'group').toLowerCase(),gm=state.settings.groups.filter(function(g){return g.name.toLowerCase()===gn})[0],tg0=gm?gm.id:impGrp();
    var t={id:uid(),grp:tg0,lm:leaderMult(tg0),date:ix(r,'date'),ticker:tk,side:/^s/i.test(ix(r,'side'))?'Short':'Long',setup:ix(r,'setup'),
      qty:qty,entry:parseFloat(ix(r,'entry')),exit:parseFloat(ix(r,'exit')),stop:ix(r,'stop')===''?null:parseFloat(ix(r,'stop')),
      mult:parseFloat(ix(r,'multiplier'))||pointValue(tk)||0,plan:/^n/i.test(ix(r,'plan'))?'No':'Yes',mistake:ix(r,'mistake'),notes:ix(r,'notes'),time:/^\d{1,2}:\d{2}/.test(ix(r,'time'))?ix(r,'time').slice(0,5).padStart(5,'0'):''};
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!t.ticker||!(t.qty>0)||!(t.entry>0)||isNaN(t.exit)||!(t.mult>0)){bad++;return}
    if(t.setup&&state.settings.setups.indexOf(t.setup)<0)state.settings.setups.push(t.setup);
    var xd=ix(r,'exit date');if(/^\d{4}-\d{2}-\d{2}$/.test(xd)&&xd>t.date)t.xdate=xd;var xt=ix(r,'exit time'),tg=parseFloat(ix(r,'target'));if(/^\d{1,2}:\d{2}/.test(xt))t.xtime=xt.slice(0,5).padStart(5,'0');if(tg>0)t.target=tg;
    var eg=ix(r,'grade');if(eg)t.egrade=eg.slice(0,12);var cn=ix(r,'conditions');if(cn){t.conds=cn.split(';').map(function(x){return x.trim()}).filter(Boolean);t.conds.forEach(function(m){if(state.settings.conditions.indexOf(m)<0)state.settings.conditions.push(m)})}
    var fe=ix(r,'fees')||ix(r,'commission')||ix(r,'commissions'),fev=parseFloat(String(fe).replace(/[$,]/g,''));if(fe!==''&&fev>=0)t.fee=fev;
    t.mistakes=t.mistake.split(';').map(function(x){return x.trim()}).filter(function(x){return x&&x!=='None'});t.mistake=t.mistakes[0]||'None';
    t.mistakes.forEach(function(m){if(state.settings.mistakes.indexOf(m)<0)state.settings.mistakes.push(m)});
    state.trades.push(t);ok++});
  return {ok:ok,bad:bad};
}

  var row=function(label,list){var tot=list.reduce(function(a,x){return a+x.net},0),gr=list.filter(function(x){return x.net>0}).length,av=tot/list.length,all=[];list.forEach(function(x){all=all.concat(x.ts)});
    var w=all.filter(function(t){return calc(t).win}).length,dec=all.filter(function(t){return !calc(t).be}).length;
    return {label:label,n:list.length,avg:av,green:gr/list.length,tot:tot,nt:all.length,wr:dec?w/dec:0,at:all.length?tot/all.length:0}};
  var SL=sleepLabels(),ML=moodLabels(),FK={'Sleep the night before':{},'Mood':{}};

  var lvl=function(k){return function(x){var v=num(x,k);return v==null?null:ML[moodBucket(v)]}};

    secs.map(function(sc){return '<tr class="sec"><td colspan="7">'+esc(sc[0])+'</td></tr>'+sc[1].map(function(r){var fk=FK[sc[0]]&&FK[sc[0]][r.label];

    '</tbody></table></div></div>';

function sortify(){
  SORT_TARGETS.forEach(function(tg){document.querySelectorAll(tg[0]).forEach(function(cont){
    if(cont.dataset.sorted)return;cont.dataset.sorted='1';
    var scope=tg[1](cont);cont.dataset.sortScope=scope;
    var items=Array.prototype.filter.call(cont.children,function(ch){var k=sortKey(ch);if(k)ch.dataset.bk=k;return !!k});
    if(!items.length)return;
    items.forEach(function(it){
      var head=it.querySelector('.cbox-head');
      if(!head){var lb=it.querySelector('label');if(!lb||lb.classList.contains('chk'))return;
        head=document.createElement('div');head.className='cbox-head';lb.parentNode.insertBefore(head,lb);head.appendChild(lb)}

      var h=document.createElement('button');h.type='button';h.className='btn small cbox-drag';h.setAttribute('aria-label','Move this box. Drag it, or use the arrow keys.');h.title='Drag to move';h.innerHTML=GRIP;

    var pos={};order.forEach(function(k,i){pos[k]=i});

      if(pa==null&&pb==null)return items.indexOf(a)-items.indexOf(b);if(pa==null)return 1;if(pb==null)return -1;return pa-pb});
    var ref=items[items.length-1].nextSibling;

  })});
}

/* ---------- rolling win rate and expectancy ---------- */
function lineChart(vals,labels,fmt,opt){
  var W=640,H=230,L=58,R=14,T=12,B=24,pw=W-L-R,ph=H-T-B;
  var lo0=opt.min!=null?opt.min:Math.min.apply(null,vals.concat([0])),hi0=opt.max!=null?opt.max:Math.max.apply(null,vals.concat([0]));
  var ticks=niceTicks(lo0,hi0,4),lo=ticks[0],hi=ticks[ticks.length-1];
  var X=function(i){return L+(vals.length===1?pw/2:i/(vals.length-1)*pw)},Y=function(v){return T+(hi-v)/(hi-lo)*ph};
  var g='';ticks.forEach(function(v){g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="axis" x="'+(L-8)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fmt(v)+'</text>'});
  var ref=opt.ref!=null&&opt.ref>=lo&&opt.ref<=hi?'<line class="zero" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(opt.ref)+'" y2="'+Y(opt.ref)+'"/>':'';
  var d=vals.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)}).join(' ');
  var last=vals[vals.length-1],col=last>=(opt.ref||0)?'var(--gain)':'var(--loss)';
  var dots=vals.map(function(v,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="6" fill="transparent"><title>'+esc(labels[i])+': '+fmt(v)+'</title></circle>'}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.aria)+'">'+g+ref+'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'+
    '<circle cx="'+X(vals.length-1)+'" cy="'+Y(last)+'" r="4" fill="'+col+'"/>'+dots+
    '<text class="axis" x="'+L+'" y="'+(H-6)+'">'+esc(labels[0])+'</text><text class="axis" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(labels[labels.length-1])+'</text></svg>';
}

/* ---------- prop firm: evaluation progress, consistency and payouts ---------- */
function propStats(r){
  var a=r.a,am=a.mult>0?a.mult:1,days={};
  allChrono().forEach(function(t){if(!acctHas(a,t))return;days[t.date]=(days[t.date]||0)+calcRaw(t).net*am/(t.lm>0?t.lm:1)});
  var ks=Object.keys(days),best=0,bestD='';ks.forEach(function(k){if(days[k]>best){best=days[k];bestD=k}});
  var profit=r.net,cons=a.cons>0?a.cons/100:0,consOk=true,need=0;
  if(cons&&best>0){consOk=profit>0&&best<=cons*profit+1e-9;if(!consOk)need=best/cons-profit}
  return {days:ks.length,profit:profit,best:best,bestD:bestD,cons:cons,consOk:consOk,need:need};
}

function appErr(e){return String(e&&e.message||e||'unknown error')}
/* every save goes to a temporary file first and is then swapped in, so a crash mid-save never leaves a half-written file */
function appWrite(p,text){var tmp=p+'.saving';return TFS.writeTextFile(tmp,text).then(function(){return TFS.rename(tmp,p)})}
function appCfgSave(){return appWrite(appS.cfgFile,JSON.stringify(appS.cfg,null,2))}

/* ---- saving the journal ---- */
function journalFileText(){return JSON.stringify({app:'dayTradeLedger',kind:'journal',version:1,saved:new Date().toISOString(),journal:state})}
function appSaveNow(){clearTimeout(appSaveNow.h);if(!appS.ready)return Promise.resolve();
  return appWrite(appS.file,journalFileText()).then(function(){appS.last=Date.now();appS.err='';appStat()},
    function(e){appS.err=appErr(e);appStat();if(!appSaveNow.warned){appSaveNow.warned=1;toast('Could not save the journal file. See Setup & data, Backup & data')}})}
function appStat(){var el=$('#appSaveStat');if(el)el.innerHTML=appS.err?'<span class="loss">Not saved: '+esc(appS.err)+'</span>':appS.last?'Saved at '+new Date(appS.last).toLocaleTimeString():'Saved'}

/* ---- backups ---- */
/* the full backup: the journal plus every picture, the same format as Download backup file, so Restore reads it */
function fullBackupText(journalJson){
  return picAll().then(function(recs){return Promise.all(recs.map(function(r){return blobToData(r.blob).then(function(d){return {id:r.id,owner:r.owner,name:r.name||'',ts:r.ts||0,data:d}})}))})
  .then(function(pics){return '{"app":"dayTradeLedger","kind":"full-backup","version":1,"saved":'+JSON.stringify(new Date().toISOString())+',"journal":'+(journalJson||JSON.stringify(state))+',"pictures":'+JSON.stringify(pics)+'}'})}
/* named to the second, so any number of backups can be made without one replacing another */
function appStamp(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return ymd(d)+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
/* while your backup folder cannot be reached (an unplugged drive, say), backups go to the app's own folder instead */
function appBkDir(){return appS.bkMissing?appS.internalBk:(appS.cfg.backupDir||appS.internalBk)}
function appBkWarn(missing){renderAppNote();appRefreshPanel();toast(missing?'Your backup folder can’t be reached, so backups are going to the app’s own folder for now':'Your backup folder is back. Backups go there again')}
/* checked every minute while the folder is missing, so backups move back as soon as it returns */
function appBkProbe(){var d=appS.cfg.backupDir;if(!appS.bkMissing||!d)return;
  TFS.mkdir(d,{recursive:true}).catch(function(){}).then(function(){return TFS.exists(d)}).then(function(ex){if(ex&&appS.bkMissing){appS.bkMissing=false;appBkWarn(false)}},function(){})}
/* automatic backups: one each time the app opens, one every 15 minutes while it is open and something changed, and one before
   anything risky; the newest 3 are kept. Your own backups (kind 'manual') are never deleted */
function appBackup(kind,reason){var js=JSON.stringify(state),chosen=appS.cfg.backupDir||appS.internalBk;
  var name=kind==='auto'?'tradevault-auto-'+appStamp()+(reason?'-'+reason:'')+'.json':'tradevault-backup-'+appStamp()+'.json';
  if(kind==='auto')appS.autoAt=state.savedAt||0;
  var into=function(dir){return TFS.mkdir(dir,{recursive:true}).catch(function(){}).then(function(){return fullBackupText(js)})
    .then(function(t){return appJoin(dir,name).then(function(p){return appWrite(p,t).then(function(){return p})})})};
  return into(chosen).then(function(p){if(appS.bkMissing&&chosen!==appS.internalBk){appS.bkMissing=false;appBkWarn(false)}return p},
    function(e){if(chosen===appS.internalBk)throw e;var first=!appS.bkMissing;appS.bkMissing=true;if(first)appBkWarn(true);return into(appS.internalBk)})
    .then(function(p){backupMark();return (kind==='auto'?appPrune():Promise.resolve()).then(function(){appFillList();return p})})}
/* Back up now from the panel, Ctrl+B or the tray: a toast, and a notification too when the window is out of sight */
function appBackupNow(){return appBackup('manual').then(function(p){toast('Backup saved: '+p);if(!document.hasFocus())appTell('Backup saved',p);return p},
  function(e){toast('Backup failed: '+appErr(e));appTell('Backup failed',appErr(e))})}
function appListBackups(){return TFS.readDir(appBkDir()).then(function(es){return es.filter(function(e){return e.isFile&&/^(tradevault|trade-journal)-(auto|backup)-[\w-]+\.json$/.test(e.name)}).map(function(e){return e.name}).sort().reverse()},function(){return []})}
function appPrune(){return appListBackups().then(function(ns){var auto=ns.filter(function(n){return /^(tradevault|trade-journal)-auto-/.test(n)});
  return Promise.all(auto.slice(AUTO_KEEP).map(function(n){return appJoin(appBkDir(),n).then(function(p){return TFS.remove(p)})}))})}
/* every 15 minutes, only when something changed since the last automatic backup */
function appTimed(){if(!appS.ready||(state.savedAt||0)<=(appS.autoAt||0))return;appBackup('auto','timed').catch(function(){})}
var APP_BK_WHY={'open':'when the app opened','timed':'every 15 minutes','before-merge':'before a merge','before-update':'before an update','before-restore':'before a restore','before-settings':'before loading settings','before-delete-all':'before deleting all trades','before-clear-examples':'before clearing examples'};
function appBkLabel(n){var m=/^(?:tradevault|trade-journal)-(auto|backup)-(\d{4}-\d{2}-\d{2})(?:-(\d{2})(\d{2})(\d{2})?)?(?:-([a-z][\w-]*))?\.json$/.exec(n);if(!m)return esc(n);
  var when=shortDate(m[2])+(m[3]?' at '+m[3]+':'+m[4]+(m[5]?':'+m[5]:''):''),why=APP_BK_WHY[m[6]]||'';
  return m[1]==='auto'?'<b>Automatic</b> · '+when+(why?' · '+why:''):'<b>Your backup</b> · '+when}
function appFillList(){if(!APP||!$('#appBList'))return;
  appListBackups().then(function(ns){var box=$('#appBList');if(!box)return;var auto=ns.filter(function(n){return /^(tradevault|trade-journal)-auto-/.test(n)}).length;
    box.innerHTML=!ns.length?'<p class="muted">No backups yet.</p>':
      '<p class="muted" style="font-size:12px;margin:0 0 6px">'+auto+' automatic (the newest '+AUTO_KEEP+' are kept) and '+(ns.length-auto)+' of your own.</p>'+
      '<div class="app-bk">'+ns.slice(0,40).map(function(n){return '<div class="app-bk-row"><span>'+appBkLabel(n)+'</span><button class="btn small" type="button" data-appres="'+esc(n)+'">Restore</button></div>'}).join('')+'</div>'+
      (ns.length>40?'<p class="muted" style="font-size:12px">Showing the newest 40. Open the folder to see the rest.</p>':'')})}
/* restoring from the list: the same preview and confirmation as Restore from backup file */
function appRestoreFrom(name){appJoin(appBkDir(),name).then(function(p){return TFS.readTextFile(p)}).then(function(t){readBackupText(t);var m=$('#dataMsg');if(m)m.scrollIntoView({behavior:'smooth',block:'center'})})
  .catch(function(e){toast('Could not read that backup: '+appErr(e))})}
function appChooseBackupDir(){return TDLG.open({directory:true,title:'Choose a folder for your TradeVault backups'}).then(function(d){if(!d)return;
  appS.cfg.backupDir=d;appS.bkMissing=false;return appCfgSave().then(function(){return appBackup('auto')}).then(function(){appRefreshPanel();renderAppNote();toast('Backups will be saved in '+d)})})
  .catch(function(e){toast('Could not use that folder: '+appErr(e))})}

/* ---- the panel in Setup & data, Backup & data, in place of the browser's folder backup ---- */
function appPanelHTML(){var c=appS.cfg;
  return '<div class="fs-box" id="appBox"><h2 class="sub">Journal file and backups</h2>'+
    '<div class="app-row"><div class="app-txt"><b>Journal file</b><div class="app-path">'+esc(appS.file||'Loading…')+'</div><div class="muted" style="font-size:12px" id="appSaveStat"></div></div>'+
      '<div class="app-btns"><button class="btn small" type="button" id="appJShow">Show in folder</button></div></div>'+
    '<div class="app-row"><div class="app-txt"><b>Backup folder</b><div class="app-path">'+(c.backupDir?esc(c.backupDir):'<span class="loss">Not chosen yet.</span> Until you pick one, automatic backups stay in the app’s own folder.')+'</div>'+
      (appS.bkMissing?'<div class="loss" style="font-size:12px">Can’t be reached right now. Backups are going to the app’s own folder until it is back, and the list below shows those.</div>':'')+'</div>'+
      '<div class="app-btns"><button class="btn small'+(c.backupDir?'':' primary')+'" type="button" id="appBPick">'+(c.backupDir?'Change folder':'Choose folder')+'</button><button class="btn small" type="button" id="appBShow">Show in folder</button></div></div>'+
    '<p class="muted" style="font-size:12px;margin:8px 0">The journal saves to its file as you work. The app makes an automatic backup, pictures included, each time it opens, every 15 minutes while it is open (when something changed), and right before a restore, loading settings, deleting all trades or clearing the examples. It keeps the newest '+AUTO_KEEP+'. Back up now (or '+esc(keyShow(keyFor('backup'))||'its shortcut')+') makes as many backups as you like, and those are never deleted.</p>'+
    '<div class="actions" style="margin-top:0"><button class="btn primary" type="button" id="appBNow">Back up now</button></div>'+
    '<div id="appBList" style="margin-top:10px"><p class="muted">Loading backups…</p></div></div>'}
function appRefreshPanel(){var b=$('#appBox');if(b){b.outerHTML=appPanelHTML();appStat();appFillList()}}

/* ---- the banner at the top: a missing backup folder, a welcome on the first run, and a nudge until a backup folder is chosen ---- */
function renderAppNote(){var el=$('#appNote');if(!el)return;if(!APP||!appS.ready){el.hidden=true;el.innerHTML='';return}
  var upd=appUpdBannerHTML();if(ui.tab==='data'){el.hidden=!upd;el.innerHTML=upd;return}
  var later=lsGet('dayTradeLedger.appNoteLater'),msgs=[],canLater=false;
  if(appS.bkMissing)msgs.push('<b>Your backup folder can’t be reached</b> ('+esc(appS.cfg.backupDir)+'). If it is on a drive that is unplugged, plug it back in. Until then, backups go to the app’s own folder.');
  if(appS.first&&exAny()){msgs.push('<b>Welcome to TradeVault.</b> To bring in your journal from the browser, use Restore from backup file in Setup &amp; data, Backup &amp; data, or drop the backup file onto this window.');canLater=true}
  if(!appS.cfg.backupDir&&!(later&&+later>Date.now())){msgs.push('<b>Choose a backup folder</b> so your backups are kept where you want them.');canLater=true}
  if(!msgs.length){el.hidden=!upd;el.innerHTML=upd;return}
  el.hidden=false;el.innerHTML=upd+(upd?'<div style="height:8px"></div>':'')+'<div class="banner" role="status"><span>'+msgs.join('<br>')+'</span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small primary" type="button" id="appNoteGo">Open Backup &amp; data</button>'+(canLater?'<button class="btn small" type="button" id="appNoteLater">Later</button>':'')+'</span></div>'}

/* ---- updates: TradeVault asks GitHub for the newest version a little after it opens, every 6 hours while it runs, and when you
   press Check for updates. Installing saves the journal and backs it up first; the app then closes, updates and opens again ---- */
function appUpdOn(){return appS.cfg.autoUpdate!==false}
function appCheckUpdate(manual){if(!TUPD)return Promise.resolve(null);if(manual)appUpdStat('Checking…');
  return Promise.resolve(TUPD.check()).then(function(u){appS.update=u||null;appS.updErr='';appS.updChecked=Date.now();renderAppNote();appUpdStat();
      if(u&&!manual&&!document.hasFocus()&&appS.updTold!==u.version){appS.updTold=u.version;appTell('TradeVault '+u.version+' is ready','Open TradeVault and choose Update now.')}
      if(manual&&!u)toast('You have the newest version');return u},
    function(e){var m=appErr(e);if(/release JSON|404|error sending request|dns|connect/i.test(m))m='no update information found online (nothing published yet, or no internet connection)';
      appS.updErr=m;appUpdStat();if(manual)toast('Could not check for updates: '+m);return null})}
function appUpdStat(text){var el=$('#appUpdStat');if(!el)return;var u=appS.update;
  el.innerHTML=text?esc(text):u?'<b>TradeVault '+esc(u.version)+' is ready.</b> <button class="btn small primary" type="button" id="appUpdNow">Update now</button>':
    appS.updErr?'<span class="loss">Couldn’t check: '+esc(appS.updErr)+'</span>':
    appS.updChecked?'You have the newest version. Checked at '+new Date(appS.updChecked).toLocaleTimeString()+'.':'Not checked yet.'}
function appUpdBannerHTML(){var u=appS.update;if(!u||appS.updLater===u.version)return '';
  if(appS.updating)return '<div class="banner" role="status"><span><b>Updating TradeVault to '+esc(u.version)+'…</b> <span id="appUpdPct"></span> TradeVault closes and opens again by itself.</span></div>';
  var notes=String(u.body||'').split(/\r?\n/).map(function(l){return l.replace(/^[-•*]\s*/,'').trim()}).filter(Boolean).slice(0,3).join(' · ');
  return '<div class="banner" role="status"><span><b>TradeVault '+esc(u.version)+' is ready.</b> '+(notes?esc(notes.length>220?notes.slice(0,217)+'…':notes)+' ':'')+'Your journal is saved and backed up before it installs.</span>'+
    '<span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small primary" type="button" id="appUpdNow">Update now</button><button class="btn small" type="button" id="appUpdLater">Later</button></span></div>'}
function appInstallUpdate(){var u=appS.update;if(!u||appS.updating)return;appS.updating=true;renderAppNote();appUpdStat('Updating…');
  appSaveNow().then(function(){return appBackup('auto','before-update')}).catch(function(){})
  .then(function(){var got=0,total=0;return u.downloadAndInstall(function(ev){
    if(ev.event==='Started')total=ev.data&&ev.data.contentLength||0;
    else if(ev.event==='Progress'){got+=ev.data&&ev.data.chunkLength||0;var el=$('#appUpdPct');if(el&&total)el.textContent=Math.min(100,Math.round(got/total*100))+'% downloaded.'}})})
  .then(function(){return TPROC&&TPROC.relaunch()})
  .catch(function(e){appS.updating=false;renderAppNote();appUpdStat();toast('The update did not install: '+appErr(e))})}

/* ---- pictures as files: pictures\<id>.png (or .jpg and so on) plus pictures\pictures.json, which lists what each picture belongs to.
   The first time, pictures already saved in the app's browser storage are copied over; that copy is left as it was ---- */
function appPicStore(){
  var dir,idxFile,idx={},queue=Promise.resolve(),EXT={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','image/bmp':'bmp','image/svg+xml':'svg'};
  var safe=function(id){return String(id).replace(/[^\w-]/g,'_').slice(0,80)};
  var saveIdx=function(){return appWrite(idxFile,JSON.stringify(idx))};
  var inTurn=function(fn){var p=queue.then(fn);queue=p.catch(function(){});return p};   /* one change at a time, in order */
  var list=function(){return Object.keys(idx).map(function(k){return idx[k]})};
  var load=function(m){return appJoin(dir,m.file).then(function(p){return TFS.readFile(p)}).then(function(b){return {id:m.id,owner:m.owner,name:m.name,ts:m.ts,blob:new Blob([b],{type:m.type||''})}})};
  var loadAll=function(ms){return Promise.all(ms.sort(byTs).map(function(m){return load(m).catch(function(){return null})})).then(function(rs){return rs.filter(Boolean)})};
  var store={
    add:function(rec){return inTurn(function(){var ty=rec.blob&&rec.blob.type||'',file=safe(rec.id)+'.'+(EXT[ty]||'img'),old=idx[rec.id];
      return rec.blob.arrayBuffer().then(function(b){return appJoin(dir,file).then(function(p){return TFS.writeFile(p,new Uint8Array(b))})})
      .then(function(){idx[rec.id]={id:rec.id,owner:rec.owner,name:rec.name||'',ts:rec.ts||Date.now(),type:ty,file:file};return saveIdx()})
      .then(function(){if(old&&old.file!==file)return appJoin(dir,old.file).then(function(p){return TFS.remove(p)}).catch(function(){})})})},
    byOwner:function(o){return loadAll(list().filter(function(m){return m.owner===o}))},
    all:function(){return loadAll(list())},
    del:function(id){return inTurn(function(){var m=idx[id];if(!m)return;delete idx[id];return saveIdx().then(function(){return appJoin(dir,m.file)}).then(function(p){return TFS.remove(p)}).catch(function(){})})},
    meta:function(){return Promise.resolve(list().map(function(m){return {id:m.id,owner:m.owner}}))}};
  return appJoin(appS.home,'pictures').then(function(d){dir=d;return TFS.mkdir(d,{recursive:true}).catch(function(){})})
  .then(function(){return appJoin(dir,'pictures.json')}).then(function(p){idxFile=p;return TFS.exists(p)})
  .then(function(ex){if(ex)return TFS.readTextFile(idxFile).then(function(t){idx=JSON.parse(t)||{}});
    return idbAll().catch(function(){return []}).then(function(rs){return rs.reduce(function(pr,r){return pr.then(function(){return store.add(r)})},Promise.resolve())}).then(function(){return inTurn(saveIdx)})})
  .then(function(){return store})}

/* ---- Windows notifications: the Dashboard reminders, each once a day, not while you are looking at the Dashboard and never
   while the journal is locked. Switch them off in Setup & data, Alerts & reminders ---- */
function appNotifyOn(){return state.settings.winNotify!==false}
function appNotePerm(){return Promise.resolve(TNOTE.isPermissionGranted()).then(function(g){return g||Promise.resolve(TNOTE.requestPermission()).then(function(p){return p==='granted'})})}
/* a short note from the app itself (backup saved, still running in the tray); never asks for permission */
function appTell(title,body){if(!TNOTE||isLocked())return;Promise.resolve(TNOTE.isPermissionGranted()).then(function(g){if(g)TNOTE.sendNotification({title:title,body:body})}).catch(function(){})}
/* the daily limit banner's Windows notification (it only rings in the app, with notifications switched on) */
function limitTell(title,body){if(!APP||!TNOTE||!appNotifyOn()||isLocked())return;appNotePerm().then(function(ok){if(ok)TNOTE.sendNotification({title:title,body:body})}).catch(function(){})}
function appPlain(h){var d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('button').forEach(function(b){b.remove()});return d.textContent.replace(/\s+/g,' ').trim()}
function appNotify(){if(!APP||!TNOTE||!appS.ready||!appNotifyOn()||isLocked())return;
  var today=ymd(new Date()),H=remHidden();if(H.until&&H.until>=today)return;
  var dismissed=H.day===today?H.keys||[]:[],seen={};try{seen=JSON.parse(lsGet('dayTradeLedger.notified')||'{}')||{}}catch(e){}
  if(seen.day!==today)seen={day:today,keys:[]};
  var L=remList().filter(function(x){return dismissed.indexOf(x[0])<0&&seen.keys.indexOf(x[0])<0});if(!L.length)return;
  L.forEach(function(x){seen.keys.push(x[0])});lsSet('dayTradeLedger.notified',JSON.stringify(seen));
  if(document.hasFocus()&&ui.tab==='dash')return;
  appNotePerm().then(function(ok){if(!ok)return;
    TNOTE.sendNotification(L.length===1?{title:'TradeVault reminder',body:appPlain(L[0][1])}:{title:'TradeVault: '+L.length+' reminders',body:L.slice(0,4).map(function(x){return '• '+appPlain(x[1])}).join('\n')})}).catch(function(){})}

    note('Point this at the folder your NinjaTrader, Tradovate, TradingView or Rithmic exports go to. New trade files there are imported by themselves within about 30 seconds, with a notification, and trades you already have are skipped. Files already in the folder when you choose it are left alone.')+
    '<h2 class="sub" style="margin-top:20px">Tray icon</h2>'+
    '<label class="chk"><input id="appTrayPnl" type="checkbox"'+(appS.cfg.trayPnl!==false?' checked':'')+'> Show today\u2019s P&amp;L and trade count when I point at the tray icon</label>'+
    '<h2 class="sub" style="margin-top:20px">Breaks while trading</h2>'+

/* turns a key press into the shortcut's name, like CommandOrControl+Alt+T; it needs Ctrl or Alt so it can't clash with typing */
function qlKeyFrom(e){var k=e.key;if(!k||/^(Control|Shift|Alt|Meta)$/.test(k))return null;
  k=k.length===1?k.toUpperCase():/^F\d{1,2}$/.test(k)?k:k==='Space'||k===' '?'Space':null;if(!k||!(e.ctrlKey||e.metaKey||e.altKey))return null;

/* ---- the import folder: new trade CSV files that appear there are imported by themselves, within about 30 seconds ----

function appImportScan(markOnly){var d=appS.cfg.importDir;if(!d||!appS.ready||appImportScan.busy)return Promise.resolve();appImportScan.busy=true;
  var seen=appS.cfg.imported=appS.cfg.imported||{},todo=[],changed=false;
  return TFS.readDir(d).then(function(es){return Promise.all(es.filter(function(e){return e.isFile&&/\.(csv|txt)$/i.test(e.name)}).map(function(e){
      return appJoin(d,e.name).then(function(p){return TFS.stat(p).then(function(st){var mt=st.mtime?new Date(st.mtime).getTime():0,sig=(st.size||0)+'|'+mt;
        /* a file still being written (changed in the last few seconds) waits for the next look */
        if(seen[e.name]===sig||Date.now()-mt<5000)return;seen[e.name]=sig;changed=true;if(!markOnly)todo.push({p:p,name:e.name})})})}))})
  .then(function(){return changed?appCfgSave():null})
  .then(function(){return todo.reduce(function(pr,f){return pr.then(function(){return TFS.readTextFile(f.p).then(function(text){var r=runImport(text,document.createElement('div'));

  .catch(function(e){appS.cfg.lastImport={when:Date.now(),msg:'Could not read the folder: '+appErr(e)}})
